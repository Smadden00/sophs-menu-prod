# /etc/nginx/sites-available/sophsmenu

# HTTP server - serve directly (temporary for testing)
server {
    listen 80;
    server_name sophsmenu.com ec2-54-196-56-159.compute-1.amazonaws.com 54.196.56.159;
    
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

